[env:stamps3-ros-tinyusb]
;; Same as stamps3-ros, but with the software USB stack instead of the
;; hardware USB-Serial-JTAG peripheral.
;;
;; Why: rosserial is bidirectional. The board has to READ the topic-negotiation
;; request and the subscribed topic data (look_at). stamps3-ros only ever has to
;; talk -- main.cpp animates the eye by itself -- so HWCDC is enough there. It is
;; not enough when something outside is driving the gaze.
;;
;; ARDUINO_USB_MODE=0 selects TinyUSB (USBCDC) instead of HWCDC. Uploading then
;; goes through esptool with the 1200-baud auto-reset, which is why
;; upload_protocol is set; if the board does not reset on its own, hold BOOT.
;;
;; NOTE: "HWCDC RX does not work for rosserial" is how this was diagnosed at the
;; time, but the failing log was not kept. Arduino-ESP32 2.0.x had known HWCDC RX
;; problems, so it is plausible; it has not been re-tested since. If you want to
;; settle it, build stamps3-ros, flash one board, and watch whether serial_node
;; gets past "Requesting topics...".
extends = env:stamps3-ros
upload_protocol = esptool
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=0
	-DSTAMPS3
	-DUSE_ROS
	;; Boot to the measured iris neutral of this robot's displays, so a reset
	;; does not leave the iris somewhere else until the first look_at lands.
	;; Re-measure after replacing a module (eye_calibration.py).
	-DEYE_BOOT_GAZE_X=13.5
	-DEYE_BOOT_GAZE_Y=9.0

